# Konfigurasi Nginx Native VPS / Raspberry Pi / Orange Pi
# Salin ke: /etc/nginx/sites-available/kantin
# Aktifkan: ln -s /etc/nginx/sites-available/kantin /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/kantin.crt;
    ssl_certificate_key /etc/nginx/ssl/kantin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auto-redirect root ke /kantin/
    location = / {
        return 301 /kantin/;
    }

    # API Backend: https://<ip>/kantin/api/
    location /kantin/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Static Build: https://<ip>/kantin/
    location /kantin/ {
        alias /var/www/kantin/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /kantin/index.html;
    }
}
