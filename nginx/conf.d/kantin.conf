# Server Block HTTP -> Redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect seluruh akses HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

# Server Block HTTPS (SSL/TLS) - https://<ip>/kantin
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate & Private Key (Dapat menggunakan self-signed atau Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/kantin.crt;
    ssl_certificate_key /etc/nginx/ssl/kantin.key;

    # SSL Protocols & Ciphers (Keamanan Tingkat Tinggi)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Root redirect: jika reviewer membuka https://<ip>/ langsung diarahkan ke https://<ip>/kantin/
    location = / {
        return 301 /kantin/;
    }

    # API Backend Proxy: https://<ip>/kantin/api/
    location /kantin/api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Fallback API Proxy: https://<ip>/api/
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Web UI: https://<ip>/kantin/
    location /kantin/ {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fallback SPA routing
        proxy_intercept_errors on;
        error_page 404 = /kantin/index.html;
    }
}
